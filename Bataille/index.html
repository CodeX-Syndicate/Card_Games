<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Jeu de Bataille - Card Games Syndicate</title>
    <link rel="shortcut icon" href="/images/blackjack.png" type="image/png">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- CSS absolu depuis la racine -->
    <link rel="stylesheet" href="/Bataille/style.css?v=1.0">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <a href="/" class="back-link">
                <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z" fill="currentColor"/></svg>
                Accueil
            </a>
            <h1 class="scrolling-title">La Bataille</h1>
            <div class="table-info">Arène Classique</div>
        </header>        

        <!-- Table Area -->
        <div class="tableBoard" id="tableBoard">
            <!-- CPU Player Section -->
            <div class="player-section" id="cpuSection" style="display: none;">
                <div class="score-badge">
                    <span class="score-icon">🤖</span>
                    <span class="score-text" id="cpuScoreText">Ordinateur : 26 cartes</span>
                </div>
                <div class="progress-bar-container">
                    <div class="progress-bar cpu-bar" id="cpuBar" style="width: 50%;"></div>
                </div>
            </div>

            <!-- Start Game CTA Button -->
            <button class="playGame" id="playGame" onclick="launchGame()">
                <span class="play-icon">⚔️</span> Distribuer les Cartes
            </button>

            <!-- Cards Arena Field -->
            <div class="arena-zone" id="arenaZone" style="display: none;">
                <div class="status-banner" id="statusBanner">BATAILLE !</div>

                <div class="battle-field">
                    <!-- CPU Played Card Slot -->
                    <div class="card-slot">
                        <span class="slot-label">Ordinateur</span>
                        <div class="cards-container" id="cpuCardContainer">
                            <img src="/images/cards/cardBack.png" class="card-back" alt="Dos de carte">
                        </div>
                    </div>

                    <!-- Player Played Card Slot -->
                    <div class="card-slot">
                        <span class="slot-label">Vous</span>
                        <div class="cards-container" id="playerCardContainer">
                            <img src="/images/cards/cardBack.png" class="card-back" alt="Dos de carte">
                        </div>
                    </div>
                </div>
            </div>

            <!-- Human Player Section -->
            <div class="player-section" id="humanSection" style="display: none;">
                <div class="score-badge player-badge">
                    <span class="score-icon">👤</span>
                    <span class="score-text" id="playerScoreText">Vous : 26 cartes</span>
                </div>
                <div class="progress-bar-container">
                    <div class="progress-bar" id="playerBar" style="width: 50%;"></div>
                </div>
            </div>

            <!-- Modal PopUp Result -->
            <div id="popUp" class="modal">
                <h2 class="result-title" id="resultTitle">Victoire ! 🎉</h2>
                <p class="result-sub" id="resultSub">Vous avez remporté toutes les cartes de la partie.</p>
                <button class="resetGame" id="resetGame" onclick="launchGame()">Recommencer une partie</button>
            </div>
        </div>

        <!-- Gamer Control Board -->
        <div class="gamerBoard" id="gamerBoard" style="display: none;">
            <div class="action-buttons">
                <button class="btn-action btn-draw" id="drawBtn" onclick="playTurn()">
                    ⚡ Tirer une carte
                </button>
                <button class="btn-action btn-autoplay" id="autoBtn" onclick="toggleAutoPlay()">
                    ▶️ Mode Automatique
                </button>
            </div>
        </div>
    </div>

    <!-- JS absolu depuis la racine -->
    <script src="/Bataille/script.js?v=1.0"></script>
</body>
</html>
