<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Poker Texas Hold'em - Card Games Syndicate</title>
    <link rel="shortcut icon" href="/images/blackjack.png" type="image/png">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- CSS absolu depuis la racine -->
    <link rel="stylesheet" href="/Poker/style.css?v=1.0">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <a href="/" class="back-link">
                <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z" fill="currentColor"/></svg>
                Accueil
            </a>
            <h1 class="scrolling-title">Texas Hold'em</h1>
            <div class="bankroll-badge">
                <span>💰 Tapis :</span>
                <span id="bankrollDisplay">$1 000</span>
            </div>
        </header>        

        <!-- Table Area -->
        <div class="tableBoard" id="tableBoard">
            <!-- Dealer Section -->
            <div class="poker-section" id="dealerSection" style="display: none;">
                <div class="info-badge">
                    <span>🎩 Croupier</span>
                    <span id="dealerStatusText" style="font-size:0.85rem; color: var(--text-muted); font-weight: normal;">(Mise : $0)</span>
                </div>
                <div class="hole-cards" id="dealerCards"></div>
            </div>

            <!-- Start Game CTA Button -->
            <button class="playGame" id="playGame" onclick="startNewHand()">
                <span class="play-icon">🃏</span> Distribution de la Main ($25)
            </button>

            <!-- Community Cards Area -->
            <div class="community-area" id="communityArea" style="display: none;">
                <div class="pot-badge">
                    <span>🏆 Pot :</span>
                    <span id="potDisplay">$0</span>
                </div>

                <div class="community-cards" id="communityCards"></div>

                <div class="hand-eval-tag" id="handEvalTag">
                    Votre main : Pré-flop
                </div>
            </div>

            <!-- Player Section -->
            <div class="poker-section" id="playerSection" style="display: none;">
                <div class="hole-cards" id="playerCards"></div>
                <div class="info-badge player-badge">
                    <span>👤 Vos Cartes Privées</span>
                    <span id="playerBetText" style="font-size:0.85rem; color: var(--gold-hover); font-weight: normal;">(Mise : $0)</span>
                </div>
            </div>

            <!-- Modal PopUp Result -->
            <div id="popUp" class="modal">
                <h2 class="result-title" id="resultTitle">Victoire ! 🎉</h2>
                <p class="result-sub" id="resultSub">Vous avez remporté le pot de $150 avec une Double Paire !</p>
                <button class="resetGame" id="resetGame" onclick="startNewHand()">Main Suivante</button>
            </div>
        </div>

        <!-- Gamer Control Board -->
        <div class="gamerBoard" id="gamerBoard" style="display: none;">
            <div class="action-row">
                <button class="btn-poker btn-check" id="checkBtn" onclick="userCheck()">Check (Parler)</button>
                <button class="btn-poker btn-call" id="callBtn" onclick="userCall()">Suivre ($0)</button>
                <button class="btn-poker btn-bet" id="bet25Btn" onclick="userBet(25)">Miser $25</button>
                <button class="btn-poker btn-bet" id="bet50Btn" onclick="userBet(50)">Miser $50</button>
                <button class="btn-poker btn-bet" id="bet100Btn" onclick="userBet(100)">Miser $100</button>
                <button class="btn-poker btn-fold" id="foldBtn" onclick="userFold()">Se Couché</button>
            </div>
        </div>
    </div>

    <!-- JS absolu depuis la racine -->
    <script src="/Poker/script.js?v=1.0"></script>
</body>
</html>
